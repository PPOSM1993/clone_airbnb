version: "3.9"

services:
  web:
    build: .
    volumes:
      - ./:/usr/src/backend
    ports:
      - "8000:8000"
    env_file:
      - ./.env.dev
    depends_on:
      - db
    entrypoint: ["/usr/src/backend/entrypoint.sh"]

  db:
    image: postgres:15
    container_name: backend-db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: airbnb
    ports:
      - "5432:5432"

volumes:
  postgres_data:
